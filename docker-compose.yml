services:
  server-handler:
    build:
      context: "./backend/server-manager"
      dockerfile: Dockerfile
    image: purpledrip/server-handler:latest
    container_name: server-handler
    ports:
      - "5000:5000"
    env_file:
      - ./backend/server-manager/.env
    environment:
      - NODE_ENV=production
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

  socket-handler:
    build:
      context: "./backend/socket-manager"
      dockerfile: Dockerfile
    image: purpledrip/socket-handler:latest
    container_name: socket-handler
    ports:
      - "5001:5001"
    env_file:
      - ./backend/socket-manager/.env
    environment:
      - NODE_ENV=production
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: purpledrip/frontend-db:latest
    container_name: frontend
    env_file:
      -  ./frontend/.env
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      - server-handler
      - socket-handler

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - app-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - app-network
    depends_on:
      - prometheus

networks:
  app-network:
    driver: bridge

volumes:
  grafana-storage:
